services:
  - type: web
    name: erp-demand-forecast-api
    runtime: python
    rootDir: backend
    healthCheckPath: /health
    buildCommand: python -m pip install --upgrade pip setuptools wheel && python -m pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.13
      - key: DATABASE_URL
        sync: false
      - key: MODEL_PATH
        value: models/xgboost_model.pkl
      - key: DATASET_DIR
        value: datasets
      - key: ALLOWED_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO
